<!DOCTYPE html>
<html><head><meta charset='utf-8'>
<title>Chennai Super Kings vs Royal Challengers Bangalore</title>
<script src='https://cdn.jsdelivr.net/npm/chart.js'></script>
<style>
  body { font-family: 'Segoe UI', Arial, sans-serif; background:#0f172a; color:#e2e8f0; margin:0; padding:32px; }
  h1 { text-align:center; font-weight:600; margin-bottom:28px; }
  .chart-wrap { max-width:920px; margin:0 auto; background:#1e293b; padding:28px; border-radius:14px; box-shadow:0 4px 24px rgba(0,0,0,0.35); }
</style>
</head><body>
<h1>Chennai Super Kings vs Royal Challengers Bangalore</h1>
<div class='chart-wrap'><canvas id='chart'></canvas></div>
<script>
const labels = ["Matches","Wins","Losses"];
new Chart(document.getElementById('chart'), {
  type: 'bar',
  data: { labels: labels, datasets: [
    { label: 'Chennai Super Kings', data: [266,148,118], backgroundColor: '#38bdf8' },
    { label: 'Royal Challengers Bangalore', data: [240,114,126], backgroundColor: '#f472b6' }
  ] },
  options: { responsive: true, scales: { y: { beginAtZero: true } } }
});
</script>
</body></html>
